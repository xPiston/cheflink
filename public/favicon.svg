<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ChefLink">
  <!--
    The header's own mark: lucide's UtensilsCrossed on the 24-grid, scaled 1.875x
    into a 64 square with a 9.5-unit margin. It could sit deeper in the frame -
    the nav icon has a tighter box than a tab does - but the extra room is what
    keeps the fork and knife apart at 16px, where the browser draws it first.

    Colours come from the app rather than from the "primary" token, which flips
    between near-white and near-black with the theme: bg-base dark (#0a1418)
    behind, lagoon (#60d7cf) in front, so the tab reads the same whether the
    browser is light or dark. No double hyphen anywhere in here: XML forbids
    one inside a comment, and ImageMagick refuses to rasterise the file.
  -->
  <rect width="64" height="64" rx="14" fill="#0a1418" />
  <g transform="translate(9.5 9.5) scale(1.875)" fill="none" stroke="#60d7cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" />
    <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" />
    <path d="m2.1 21.8 6.4-6.3" />
    <path d="m19 5-7 7" />
  </g>
</svg>
