version: 2

# Grouping is what keeps this useful: ungrouped, half of these produce pull
# requests that cannot be merged on their own, because the packages below are
# released as sets and bound to each other by peer ranges.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Router, Start and the route generator are one release train: the CLI
      # writes the route tree the router reads, and Start pins the router it
      # was built against. One of the three alone does not install.
      tanstack:
        patterns:
          - '@tanstack/*'
      # React and its types travel together, or the types describe a React
      # that is not installed.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # drizzle-kit reads the schema drizzle-orm defines, and a migration
      # generated by one version is not always understood by the other.
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      # Wrangler and the Workers types describe the same runtime; a type for
      # an API the installed wrangler does not emulate is worse than none.
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/workers-types'
          - 'nitro'
      vite:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
          - 'tailwind-merge'

  # `deploy.yml` pins its actions by major, which is a moving target nobody is
  # watching otherwise - and this is the repository where a push deploys.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
